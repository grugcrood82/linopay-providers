name: node-ci

# Node.js / TypeScript SDK + CLI test pipeline.
#
# Filled in during Phase 1 — this file exists today so the workflow
# path is committed at Phase 0 (per the SOW's folder skeleton), and the
# shared layout (checkout + Docker-based test runner) is the right shape
# from the start so we don't churn CI config later.
#
# Canonical local invocation (per SOW §2.6):
#   docker compose -f node/docker-compose.test.yml up \
#     --build --abort-on-container-exit --exit-code-from node-tests
#   docker compose -f node/docker-compose.test.yml down -v

on:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - 'cli/**'
      - 'test-infra/**'
      - '.github/workflows/node-ci.yml'
  pull_request:
    paths:
      - 'node/**'
      - 'cli/**'
      - 'test-infra/**'
      - '.github/workflows/node-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build + run containerized test stack
        run: |
          docker compose -f node/docker-compose.test.yml up \
            --build --abort-on-container-exit --exit-code-from node-tests
      - name: Tear down test stack
        if: always()
        run: docker compose -f node/docker-compose.test.yml down -v
