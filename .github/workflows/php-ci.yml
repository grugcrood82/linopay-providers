name: php-ci

# PHP SDK + WooCommerce plugin test pipeline.
#
# Filled in during Phase 2 — the WooCommerce e2e job is the heaviest
# one in the repo (WordPress + WooCommerce + WireMock + headless
# browser) so we keep it on its own runner pool size.
#
# Canonical local invocation (per SOW §2.6):
#   docker compose -f php/docker-compose.test.yml up \
#     --build --abort-on-container-exit --exit-code-from php-tests
#   docker compose -f woocommerce-plugin/docker-compose.test.yml up \
#     --build --abort-on-container-exit --exit-code-from woocommerce-e2e

on:
  push:
    branches: [main]
    paths:
      - 'php/**'
      - 'woocommerce-plugin/**'
      - 'test-infra/**'
      - '.github/workflows/php-ci.yml'
  pull_request:
    paths:
      - 'php/**'
      - 'woocommerce-plugin/**'
      - 'test-infra/**'
      - '.github/workflows/php-ci.yml'

jobs:
  test:
    # The PHP SDK ships in Phase 2. Until that branch lands in main,
    # the php/ directory may be empty on the current HEAD. Skip the
    # job cleanly with a friendly notice instead of failing on a
    # missing docker-compose.test.yml.
    if: hashFiles('php/docker-compose.test.yml') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build + run PHP test stack
        run: |
          docker compose -f php/docker-compose.test.yml up \
            --build --abort-on-container-exit --exit-code-from php-tests
      - name: Tear down PHP stack
        if: always()
        run: docker compose -f php/docker-compose.test.yml down -v
