# Containerised test stack for the WooCommerce plugin (Phase 2 part 2).
#
# Two profiles — pick one per invocation:
#
# Unit suite (runs on every PR — fast):
#   docker compose -f woocommerce-plugin/docker-compose.test.yml \
#     --profile unit up --build --abort-on-container-exit \
#     --exit-code-from php-unit-tests
#   docker compose -f woocommerce-plugin/docker-compose.test.yml down -v
#
# Smoke test (WordPress + WooCommerce + plugin — daily or pre-merge):
#   docker compose -f woocommerce-plugin/docker-compose.test.yml \
#     --profile smoke up --build --abort-on-container-exit \
#     --exit-code-from smoke-test
#   docker compose -f woocommerce-plugin/docker-compose.test.yml down -v
#
# Default profile (no flag) brings up nothing — Compose will exit
# immediately. Pick one of the two profiles above.

name: linotech-woocommerce-test

# Named volumes for the smoke profile. Declared up front so both
# `wordpress` and `wp-init` can share them.
volumes:
  wordpress_data:

services:
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: linotech-woocommerce-wiremock
    command: ["--global-response-templating", "--verbose", "--port", "8080"]
    ports:
      - "18084:8080"
    volumes:
      - ../test-infra/wiremock/linopay/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz && exit 0 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60

  php-unit-tests:
    build:
      context: ..
      dockerfile: woocommerce-plugin/Dockerfile
      target: test
    container_name: linotech-woocommerce-unit-tests
    profiles: ["unit"]
    depends_on:
      wiremock:
        condition: service_healthy
    command: ["vendor/bin/phpunit", "--testdox"]

  # --- Below this line: smoke-test profile. ---

  db:
    # MariaDB 10.11 is wire-compatible with MySQL 8 (the production
    # WP database) but ships with the mariadb client tooling that
    # wp-cli expects. Avoids the cache_sha2_password / mysql_native_password
    # + SSL cert chain dance that the mysql:8.0 image forces on a
    # local-dev smoke stack.
    image: mariadb:10.11
    container_name: linotech-woocommerce-db
    profiles: ["smoke"]
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  wordpress:
    image: wordpress:6-php8.3-apache
    container_name: linotech-woocommerce-wordpress
    profiles: ["smoke"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', false);
    volumes:
      # Named volume so wp-init can share the same wp-config.php
      # (the WP image's entrypoint writes it on first boot).
      - wordpress_data:/var/www/html
      # Mount the plugin source into the named volume. This needs
      # to be done on the wordpress container too — the named
      # volume is shared, so wp-init inherits this mount via the
      # shared volume. (Compose's `volumes:` syntax merges; you
      # can't re-mount a sub-path of an already-mounted volume
      # from a different container.)
      - ./:/var/www/html/wp-content/plugins/linopay-woocommerce
    ports:
      - "18085:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost/wp-login.php && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  wp-init:
    image: wordpress:cli-php8.3
    container_name: linotech-woocommerce-wp-init
    profiles: ["smoke"]
    depends_on:
      wordpress:
        condition: service_healthy
    # The wp-config.php generated by the wordpress image uses
    # getenv_docker() to pull DB_HOST/DB_NAME/DB_USER at runtime
    # (with sensible defaults of 'mysql' / 'wordpress' / 'example
    # username'). The wp-init container has to share the same env
    # so wp-cli can resolve 'db'.
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ./bin/wp-init.sh:/wp-init.sh:ro
    entrypoint: ["/bin/bash", "/wp-init.sh"]

  smoke-test:
    build:
      context: ..
      dockerfile: woocommerce-plugin/Dockerfile
      target: smoke
    container_name: linotech-woocommerce-smoke-test
    profiles: ["smoke"]
    depends_on:
      wp-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    command: ["/plugin-source/bin/install-test-stack.sh"]
